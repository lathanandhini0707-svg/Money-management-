<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5b67d8">
<title>HomeFlow — Home & Money</title>
<style>
:root{
  --primary:#5b67d8; --primary2:#7b61c9; --accent:#22a890;
  --bg:#f5f7fb; --card:#ffffff; --text:#20263a; --muted:#778096;
  --line:#e8ebf3; --danger:#d85b68; --shadow:0 12px 30px rgba(43,53,91,.08);
  --radius:20px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(145deg,#f7f8fc,#eef1fb);color:var(--text)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{max-width:1100px;margin:auto;min-height:100vh}
.topbar{height:76px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:rgba(247,248,252,.9);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:white;box-shadow:0 8px 18px rgba(91,103,216,.25)}
.menu-btn{width:44px;height:44px;border:0;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:25px;color:var(--text)}
main{padding:10px 18px 40px}.hero{padding:26px 22px 22px;border-radius:28px;background:linear-gradient(135deg,#eef0ff,#f8f5ff 58%,#eaf8f4);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow)}
.greeting{font-size:clamp(24px,5vw,36px);margin:0 0 6px;letter-spacing:-1.5px}.welcome{color:var(--muted);margin:0}.date{display:inline-flex;margin-top:18px;padding:9px 13px;border-radius:12px;background:#fff;color:#5d6680;font-size:13px;font-weight:650}
.panel{display:none;margin-top:18px}.panel.active{display:block}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 2px 14px}.panel-head h2{margin:0;font-size:20px}.back{border:0;background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:12px;color:var(--primary);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 7px 22px rgba(43,53,91,.05);min-height:104px}.tile b{display:block;margin-top:8px;font-size:14px}.tile span{font-size:12px;color:var(--muted)}.icon{font-size:22px}
.content{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px;color:#606a80}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;outline:none;background:#fbfcfe;color:var(--text)}textarea{min-height:90px;resize:vertical}.req{color:var(--danger)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.primary{border:0;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:11px 17px;border-radius:13px;font-weight:750}.secondary{border:1px solid var(--line);background:#fff;padding:11px 15px;border-radius:13px;font-weight:700;color:#5e6880}
.checklist{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.check{display:flex;align-items:center;gap:9px;padding:11px;border:1px solid var(--line);border-radius:13px;background:#fafbfe}.check input{accent-color:var(--primary)}.amount{margin-left:auto;width:90px;padding:7px;border:1px solid var(--line);border-radius:9px}
.notice{padding:12px 14px;border-radius:14px;background:#f1f4ff;color:#515c7d;font-size:13px;margin-bottom:12px}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(24,29,47,.38);display:none}.drawer.open{display:block}.sheet{position:absolute;right:0;top:0;height:100%;width:min(390px,92vw);background:#fbfcff;padding:20px;overflow:auto;box-shadow:-20px 0 45px rgba(20,25,50,.16)}.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sheet h2{margin:0}.close{border:0;background:#eef0f7;border-radius:11px;width:38px;height:38px;font-size:20px}.menu-list{display:grid;gap:8px}.menu-admin{margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}.menu-item{width:100%;border:1px solid var(--line);background:#fff;padding:14px;border-radius:14px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:700;color:var(--text)}.menu-item:hover{border-color:#cfd4f5;background:#f8f8ff}.mi{width:34px;height:34px;border-radius:10px;background:#eef0ff;display:grid;place-items:center}
.reminder{position:fixed;inset:0;z-index:80;background:rgba(22,27,45,.45);display:none;place-items:center;padding:20px}.reminder.show{display:grid}.rem-card{width:min(430px,100%);background:#fff;border-radius:25px;padding:23px;box-shadow:0 25px 70px rgba(10,15,35,.25)}.rem-top{display:flex;align-items:center;gap:12px}.bell{width:46px;height:46px;border-radius:14px;background:#fff3df;display:grid;place-items:center;font-size:23px}.rem-card h3{margin:0}.rem-card p{color:var(--muted);line-height:1.55}.rem-actions{display:flex;gap:9px}.rem-actions button{flex:1}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed #d9ddea;border-radius:16px}
.small-note{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid,.checklist{grid-template-columns:1fr}.topbar{height:70px}}
@media(max-width:430px){main{padding:8px 12px 30px}.hero{padding:22px 17px}.tile{padding:13px}.content{padding:14px}}
</style>
<style>
label{font-size:12px}.field input,.field select,.field textarea{font-size:14px}.tile b{font-size:13px}.tile span{font-size:11px}
#homeStats .tile{min-height:72px;padding:12px}#homeStats .tile b{font-size:15px;margin-top:5px}
@media(max-width:600px){#homeStats{grid-template-columns:repeat(3,1fr)!important}#homeStats .tile{padding:9px}#homeStats .tile b{font-size:13px}}
</style></head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">⌂</div><span>HomeFlow</span></div>
  <button class="menu-btn" onclick="openMenu()" aria-label="Main menu">⋮</button>
</header>

<main>
<section id="home" class="hero">
  <h1 id="greeting" class="greeting">Good Evening</h1>
  <p class="welcome">Welcome — your home, money & plans in one place.</p>
  <div id="date" class="date"></div>
</section>

<div id="panels"></div>
</main>
</div>

<div id="drawer" class="drawer" onclick="closeMenu(event)">
 <aside class="sheet" onclick="event.stopPropagation()">
  <div class="sheet-top"><h2>Main Menu</h2><button class="close" onclick="closeMenu()">×</button></div>
  <div id="menuList" class="menu-list"></div>
 </aside>
</div>

<div id="reminder" class="reminder">
 <div class="rem-card">
  <div class="rem-top"><div class="bell">🔔</div><div><h3 id="remTitle">Reminder</h3><span class="small-note">Section reminder</span></div></div>
  <p id="remText">You have a pending item.</p>
  <div class="rem-actions">
   <button class="secondary" onclick="remLater()">Later</button>
   <button class="secondary" onclick="remClose()">Close</button>
   <button class="primary" onclick="remComplete()">Complete</button>
  </div>
 </div>
</div>

<script>
"use strict";

const STORE="homeflow_records_v3";
const MENU_STORE="homeflow_menu_v3";
const SUB_STORE="homeflow_subitems_v3";

const defaultSections=[
 ["income","💰","Income"],["expenses","🧾","Expenses"],["accounts","🏦","Accounts"],
 ["loans","📑","Loans / EMI"],["recharge","📱","Recharge"],["medical","🩺","Medical Expenses"],
 ["grocery","🛒","Grocery"],["savings","🎯","Savings"],["home-management","🏠","Home Management"],
 ["reminders","🔔","Reminders"],["notes","📝","Notes"],["documents","📂","Documents"],
 ["reports","📊","Reports"],["image-import","📷","Image Import"],["backup","💾","Backup / Restore"],
 ["settings","⚙️","Settings"]
];

const grocery={
 kitchen:["Mustard","Urad Dal","Toor Dal","Chana Dal","Rice","Wheat","Oil","Spices","Salt","Sugar","Other"],
 home:["Shampoo","Hair Oil","Soap","Toothpaste","Washing Powder","Dish Wash","Bathroom Cleaner","Floor Cleaner","Room Cleaner","Freshener","Other"],
 pooja:["Oil","Camphor","Incense Sticks","Wick","Cotton","Turmeric","Kumkum","Flowers","Fruits","Sugar / Prasad Items","Other"]
};

const forms={
 income:`<div class="formgrid">
 <div class="field"><label>Income Type <i class="req">*</i></label><select data-f="incomeType"><option>Monthly Income</option><option>Daily Income</option></select></div>
 <div class="field"><label>Amount <i class="req">*</i></label><input data-f="amount" type="number" min="0" step="0.01" placeholder="₹ 0"></div>
 <div class="field"><label>Date <i class="req">*</i></label><input data-f="date" type="date"></div>
 <div class="field"><label>Source <i class="req">*</i></label><input data-f="source"></div>
 <div class="field"><label>Account</label><input data-f="account" placeholder="Bank / Cash / UPI"></div></div>
 <div class="actions"><button class="primary" data-save>Save Income</button><button class="secondary" data-clear>Clear</button></div>`,

 expenses:`<div class="formgrid">
 <div class="field"><label>Category <i class="req">*</i></label><select data-f="category"><option>Grocery</option><option>Recharge</option><option>EMI</option><option>Dress</option><option>Home</option><option>Travel</option><option>Medical</option><option>Other</option></select></div>
 <div class="field"><label>Amount <i class="req">*</i></label><input data-f="amount" type="number" min="0" step="0.01"></div>
 <div class="field"><label>Date <i class="req">*</i></label><input data-f="date" type="date"></div>
 <div class="field"><label>Paid From</label><input data-f="account" placeholder="Bank / Cash / UPI"></div></div>
 <div class="actions"><button class="primary" data-save>Save Expense</button><button class="secondary" data-clear>Clear</button></div>`,

 accounts:`<div class="formgrid">
 <div class="field"><label>Person <i class="req">*</i></label><input data-f="person"></div>
 <div class="field"><label>Bank Name <i class="req">*</i></label><input data-f="bankName"></div>
 <div class="field"><label>Account Holder Name <i class="req">*</i></label><input data-f="holderName"></div>
 <div class="field"><label>Account Number <i class="req">*</i></label><input data-f="accountNumber" inputmode="numeric"></div>
 <div class="field"><label>IFSC <i class="req">*</i></label><input data-f="ifsc"></div>
 <div class="field"><label>Branch</label><input data-f="branch"></div>
 <div class="field"><label>Account Type</label><select data-f="accountType"><option>Savings</option><option>Current</option><option>Other</option></select></div>
 <div class="field"><label>Current Balance</label><input data-f="balance" type="number" min="0" step="0.01"></div></div>
 <div class="actions"><button class="primary" data-save>Save Account</button><button class="secondary" data-clear>Clear</button></div>`,

 loans:`<div class="formgrid">
 <div class="field"><label>Person <i class="req">*</i></label><input data-f="person"></div>
 <div class="field"><label>Original Principal <i class="req">*</i></label><input data-f="principal" type="number" min="0"></div>
 <div class="field"><label>Interest</label><input data-f="interest" type="number" min="0"></div>
 <div class="field"><label>Paid Principal</label><input data-f="paidPrincipal" type="number" min="0"></div>
 <div class="field"><label>Paid Interest</label><input data-f="paidInterest" type="number" min="0"></div>
 <div class="field"><label>EMI Amount</label><input data-f="emi" type="number" min="0"></div>
 <div class="field"><label>Next EMI Date</label><input data-f="emiDate" type="date"></div></div>
 <div class="actions"><button class="primary" data-save>Save Loan</button><button class="secondary" data-clear>Clear</button></div>`,

 recharge:`<div class="formgrid">
 <div class="field"><label>Name <i class="req">*</i></label><input data-f="name"></div>
 <div class="field"><label>Mobile Number <i class="req">*</i></label><input data-f="mobile" type="tel"></div>
 <div class="field"><label>Network</label><select data-f="network"><option>Jio</option><option>Airtel</option><option>Vi</option><option>BSNL</option><option>Other</option></select></div>
 <div class="field"><label>Amount <i class="req">*</i></label><input data-f="amount" type="number" min="0"></div>
 <div class="field"><label>Recharge Date</label><input data-f="date" type="date"></div>
 <div class="field"><label>Validity</label><input data-f="validity"></div>
 <div class="field"><label>Next Recharge</label><input data-f="nextDate" type="date"></div></div>
 <div class="actions"><button class="primary" data-save>Save Recharge</button><button class="secondary" data-clear>Clear</button></div>`,

 medical:`<div class="formgrid">
 <div class="field"><label>Person <i class="req">*</i></label><input data-f="person"></div>
 <div class="field"><label>Expense Type <i class="req">*</i></label><select data-f="type"><option>Medicine</option><option>Doctor</option><option>Hospital</option><option>Lab Test</option><option>Other</option></select></div>
 <div class="field"><label>Amount <i class="req">*</i></label><input data-f="amount" type="number" min="0"></div>
 <div class="field"><label>Date <i class="req">*</i></label><input data-f="date" type="date"></div>
 <div class="field"><label>Paid From</label><input data-f="paidFrom"></div>
 <div class="field"><label>Notes</label><input data-f="notes"></div></div>
 <div class="actions"><button class="primary" data-save>Save Medical Expense</button><button class="secondary" data-clear>Clear</button></div>`,

 grocery:`<div class="field"><label>Category <i class="req">*</i></label><select id="gcat" data-f="category"><option value="kitchen">Kitchen Items</option><option value="home">Home / Personal & Cleaning</option><option value="pooja">Pooja Items</option></select></div>
 <div id="groceryList" class="checklist"></div>
 <div class="field" style="margin-top:12px"><label>Purchase Date <i class="req">*</i></label><input data-f="date" type="date"></div>
 <div class="actions"><button class="primary" data-save>Save Grocery</button><button class="secondary" data-clear>Clear</button></div>`,

 savings:`<div class="formgrid">
 <div class="field"><label>Type <i class="req">*</i></label><select data-f="type"><option>Savings Plan</option><option>Goal</option></select></div>
 <div class="field"><label>Plan / Goal <i class="req">*</i></label><input data-f="plan"></div>
 <div class="field"><label>Target Amount <i class="req">*</i></label><input data-f="target" type="number" min="0"></div>
 <div class="field"><label>Already Saved</label><input data-f="saved" type="number" min="0"></div>
 <div class="field"><label>Monthly Contribution</label><input data-f="monthly" type="number" min="0"></div>
 <div class="field"><label>Target / Maturity Date</label><input data-f="date" type="date"></div></div>
 <div class="actions"><button class="primary" data-save>Save Plan</button><button class="secondary" data-clear>Clear</button></div>`,

 "home-management":`<div class="formgrid">
 <div class="field"><label>Service Type <i class="req">*</i></label><select data-f="serviceType"><option>AMC Service</option><option>Cleaning</option><option>Repair</option><option>Other</option></select></div>
 <div class="field"><label>Appliance <i class="req">*</i></label><select data-f="appliance"><option>AC</option><option>Refrigerator</option><option>Washing Machine</option><option>RO</option><option>TV</option><option>Other</option></select></div>
 <div class="field"><label>Company / Technician</label><input data-f="provider"></div>
 <div class="field"><label>Service Date <i class="req">*</i></label><input data-f="date" type="date"></div>
 <div class="field"><label>AMC Start</label><input data-f="amcStart" type="date"></div>
 <div class="field"><label>AMC End</label><input data-f="amcEnd" type="date"></div>
 <div class="field"><label>Cost</label><input data-f="cost" type="number" min="0"></div>
 <div class="field"><label>Status</label><select data-f="status"><option>Pending</option><option>Active</option><option>Complete</option></select></div></div>
 <div class="actions"><button class="primary" data-save>Save AMC / Service</button><button class="secondary" data-clear>Clear</button></div>`,

 reminders:`<div class="formgrid">
 <div class="field"><label>Reminder Title <i class="req">*</i></label><input data-f="title"></div>
 <div class="field"><label>Section <i class="req">*</i></label><input data-f="section"></div>
 <div class="field"><label>Date <i class="req">*</i></label><input data-f="date" type="date"></div>
 <div class="field"><label>Repeat</label><select data-f="repeat"><option>None</option><option>Daily</option><option>Weekly</option><option>Monthly</option></select></div></div>
 <div class="actions"><button class="primary" data-save>Save Reminder</button><button class="secondary" data-clear>Clear</button></div>`,

 notes:`<div class="formgrid"><div class="field"><label>Title <i class="req">*</i></label><input data-f="title"></div><div class="field"><label>Date</label><input data-f="date" type="date"></div></div>
 <div class="field" style="margin-top:12px"><label>Description <i class="req">*</i></label><textarea data-f="description"></textarea></div>
 <div class="actions"><button class="primary" data-save>Save Note</button><button class="secondary" data-clear>Clear</button></div>`,

 documents:`<div class="actions"><button class="primary" data-pick-doc>📷 Choose Image / PDF</button></div><input id="documentFile" hidden type="file" accept="image/*,.pdf,.xlsx,.xls"><div id="documentPreview"></div>`,

 reports:`<div class="formgrid"><div class="field"><label>Month <i class="req">*</i></label><input data-f="month" type="month"></div><div class="field"><label>Report Type</label><select data-f="reportType"><option>Monthly Summary</option><option>Accounts</option><option>Income & Expenses</option><option>All</option></select></div></div>
 <div class="actions"><button class="primary" data-report>View Report</button></div><div id="reportOutput"></div>`,

 "image-import":`<div class="formgrid"><div class="field"><label>Send Data To <i class="req">*</i></label><select id="importSection" data-f="targetSection">${defaultSections.filter(x=>!["image-import","backup","settings","reports"].includes(x[0])).map(x=>`<option value="${x[0]}">${x[2]}</option>`).join("")}</select></div>
 <div class="field"><label>Image <i class="req">*</i></label><input id="importFile" type="file" accept="image/*"></div></div>
 <div id="importPreview" style="display:none;margin-top:12px"></div>
 <div class="actions"><button class="primary" data-process>Process Image</button><button class="secondary" data-clear>Clear</button></div>`,

 backup:`<div class="actions"><button class="primary" data-backup>Create Backup</button><button class="secondary" data-restore>Restore Backup</button></div><input id="restoreFile" hidden type="file" accept=".json,application/json"><div id="backupStatus"></div>`,

 settings:`<div class="formgrid"><div class="field"><label>Reminder Notifications</label><select data-f="notifications"><option>On</option><option>Off</option></select></div><div class="field"><label>Currency</label><select data-f="currency"><option>INR ₹</option></select></div></div><div class="actions"><button class="primary" data-save>Save Settings</button></div>`
};

let sections=load(MENU_STORE,defaultSections);
let records=load(STORE,[]);
let current=null,editingId=null,lastImage=null;

function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function money(v){return "₹ "+(Number(v)||0).toLocaleString("en-IN",{maximumFractionDigits:2})}
function updateHome(){
 const h=new Date().getHours(),g=h<5?"Good Night":h<12?"Good Morning":h<17?"Good Afternoon":h<21?"Good Evening":"Good Night";
 document.getElementById("greeting").textContent=g;
 document.getElementById("date").textContent=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 const income=records.filter(r=>r.section==="income").reduce((s,r)=>s+(Number(r.data.amount)||0),0);
 const expense=records.filter(r=>["expenses","medical"].includes(r.section)).reduce((s,r)=>s+(Number(r.data.amount)||0),0);
 let box=document.getElementById("homeStats");
 if(!box){box=document.createElement("div");box.id="homeStats";box.style.cssText="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px";document.getElementById("home").appendChild(box)}
 box.innerHTML=`<div class="tile"><span>Income</span><b>${money(income)}</b></div><div class="tile"><span>Expenses</span><b>${money(expense)}</b></div><div class="tile"><span>Balance</span><b>${money(income-expense)}</b></div>`;
}
function buildMenu(){
 document.getElementById("menuList").innerHTML=sections.map(s=>`<button class="menu-item" onclick="openSection('${esc(s[0])}')"><span class="mi">${s[1]}</span>${esc(s[2])}</button>`).join("")+
 `<div class="menu-admin"><button class="secondary" style="width:100%;margin-top:10px" onclick="addMenu()">＋ Add Main Menu</button><button class="secondary" style="width:100%;margin-top:8px" onclick="addSub()">＋ Add / Manage Sub Items</button></div>`;
}
function openMenu(){document.getElementById("drawer").classList.add("open")}
function closeMenu(e){if(!e||e.target.id==="drawer")document.getElementById("drawer").classList.remove("open")}
function addMenu(){const n=prompt("Enter Main Menu name:");if(!n?.trim())return;sections.push(["custom-"+Date.now(),"📌",n.trim()]);save(MENU_STORE,sections);buildMenu();alert("Main Menu added.")}
function addSub(){
 if(!current){alert("Open a Main Menu first.");return}
 const s=sections.find(x=>x[0]===current),all=load(SUB_STORE,{});
 const n=prompt("Enter Sub Item name for "+(s?.[2]||"section")+":");if(!n?.trim())return;
 all[current]=all[current]||[];all[current].push(n.trim());save(SUB_STORE,all);openSection(current);
}
function openSection(id){
 current=id;editingId=null;closeMenu();document.getElementById("home").style.display="none";
 const s=sections.find(x=>x[0]===id), title=s?.[2]||"Section";
 const icons=[["📌","Dashboard"],["➕","Add Entry"],["📋","Saved Data"],["🔔","Reminder"]];
 const sub=load(SUB_STORE,{})[id]||[];
 document.getElementById("panels").innerHTML=`<section class="panel active" data-section="${esc(id)}">
 <div class="panel-head"><h2>${esc(title)}</h2><button class="back" onclick="goHome()">⌂ Home</button></div>
 <div class="grid">${(id==="home-management"?[["🧹","Cleaning"],["🔧","AMC Service"],["🛠️","Repair"],["🔔","Next Reminder"]]:icons).map(x=>`<div class="tile"><div class="icon">${x[0]}</div><b>${x[1]}</b></div>`).join("")}</div>
 <div class="content">${forms[id]||`<div class="formgrid"><div class="field"><label>Name <i class="req">*</i></label><input data-f="name"></div><div class="field"><label>Amount</label><input data-f="amount" type="number"></div><div class="field"><label>Date</label><input data-f="date" type="date"></div><div class="field"><label>Notes</label><input data-f="notes"></div></div><div class="actions"><button class="primary" data-save>Save</button><button class="secondary" data-clear>Clear</button></div>`}</div>
 ${sub.length?`<div class="content"><b>Sub Items</b><div class="checklist">${sub.map(x=>`<label class="check"><input type="checkbox"><span>${esc(x)}</span></label>`).join("")}</div></div>`:""}<div id="savedList"></div></section>`;
 if(id==="grocery")renderGrocery();
 if(id==="image-import")bindImport();
 if(id==="documents")bindDocs();
 renderSaved();
}
function goHome(){document.getElementById("panels").innerHTML="";document.getElementById("home").style.display="block";current=null;editingId=null;updateHome()}
function renderGrocery(){
 const el=document.getElementById("groceryList"),cat=document.getElementById("gcat")?.value;if(!el)return;
 el.innerHTML=(grocery[cat]||[]).map(x=>`<label class="check"><input type="checkbox" data-item="${esc(x)}"><span>${esc(x)}</span><input class="amount" data-amt="${esc(x)}" type="number" min="0" placeholder="₹"></label>`).join("");
}
function formData(){
 const d={},p=document.querySelector(".panel.active");if(!p)return d;
 p.querySelectorAll("[data-f]").forEach(e=>d[e.dataset.f]=e.value);
 if(current==="grocery"){
  d.items=[];p.querySelectorAll("[data-item]").forEach(c=>{if(c.checked){const a=p.querySelector(`[data-amt="${CSS.escape(c.dataset.item)}"]`);d.items.push({name:c.dataset.item,amount:Number(a?.value)||0})}});
 }
 return d;
}
function valid(){
 const p=document.querySelector(".panel.active");if(!p)return false;
 for(const req of p.querySelectorAll(".req")){
  const el=req.parentElement?.nextElementSibling;if(el&&!String(el.value||"").trim()){alert("Please fill the required field.");el.focus();return false}
 }
 return true;
}
function saveCurrent(){
 if(!valid())return;
 const obj={id:editingId||"rec-"+Date.now()+"-"+Math.random().toString(36).slice(2),section:current,data:formData(),updatedAt:new Date().toISOString()};
 const i=records.findIndex(x=>x.id===obj.id);if(i>=0)records[i]=obj;else records.push(obj);
 save(STORE,records);editingId=null;alert("Saved successfully.");clearForm();renderSaved();updateHome();
}
function clearForm(){
 const p=document.querySelector(".panel.active");if(!p)return;
 p.querySelectorAll("input,textarea").forEach(e=>{if(e.type==="checkbox")e.checked=false;else if(e.type!=="file")e.value=""});
 p.querySelectorAll("select").forEach(e=>e.selectedIndex=0);
 if(current==="grocery")renderGrocery();editingId=null;
}
function renderSaved(){
 const h=document.getElementById("savedList");if(!h)return;
 const rows=records.filter(r=>r.section===current);
 if(!rows.length){h.innerHTML=`<div class="content"><div class="empty">No saved data yet.</div></div>`;return}
 h.innerHTML=`<div class="content"><div class="panel-head"><h2>Saved Data</h2></div>${rows.slice().reverse().map(r=>{
  const vals=Object.entries(r.data||{}).filter(([k,v])=>v!==""&&v!=null).map(([k,v])=>`<b>${esc(k)}:</b> ${esc(Array.isArray(v)?v.map(x=>x.name).join(", "):v)}`).join(" · ");
  return `<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="font-size:13px;line-height:1.6">${vals||"Saved record"}</div><div class="actions"><button class="secondary" data-edit="${r.id}">Edit</button><button class="secondary" data-delete="${r.id}">Delete</button></div></div>`;
 }).join("")}</div>`;
}
function editRecord(id){
 const r=records.find(x=>x.id===id);if(!r)return;editingId=id;
 const p=document.querySelector(".panel.active");Object.entries(r.data||{}).forEach(([k,v])=>{const e=p.querySelector(`[data-f="${CSS.escape(k)}"]`);if(e)e.value=v});
 if(current==="grocery")renderGrocery();p.scrollIntoView({behavior:"smooth"});
}
function deleteRecord(id){if(!confirm("Delete this saved data?"))return;records=records.filter(x=>x.id!==id);save(STORE,records);renderSaved();updateHome()}

function bindImport(){
 const input=document.getElementById("importFile");if(!input)return;
 input.onchange=()=>{const f=input.files?.[0],p=document.getElementById("importPreview");if(!f)return;
  if(!f.type.startsWith("image/")){alert("Please choose an image.");input.value="";return}
  lastImage=f;p.style.display="block";p.innerHTML=`<div style="font-weight:700;margin-bottom:10px">Check Image</div><img id="selectedImage" alt="Selected image" style="max-width:100%;border-radius:14px"><div class="actions"><button class="primary" data-extract>Convert to Data</button><button class="secondary" data-cancel-import>Delete</button></div>`;
  document.getElementById("selectedImage").src=URL.createObjectURL(f);
 };
}
function processImage(){
 const f=document.getElementById("importFile")?.files?.[0];if(!f){alert("Please choose an image first.");return}
 const p=document.getElementById("importPreview");p.style.display="block";p.innerHTML=`<div style="font-weight:700;margin-bottom:10px">Check Image</div><img id="selectedImage" alt="Selected image" style="max-width:100%;border-radius:14px"><div class="actions"><button class="primary" data-extract>Convert to Data</button><button class="secondary" data-cancel-import>Delete</button></div>`;
 document.getElementById("selectedImage").src=URL.createObjectURL(f);lastImage=f;
}
async function extractImage(){
 if(!lastImage){alert("Please choose an image.");return}
 const p=document.getElementById("importPreview");p.innerHTML=`<div class="notice">Processing image…</div><img id="selectedImage" style="max-width:100%;border-radius:14px">`;
 document.getElementById("selectedImage").src=URL.createObjectURL(lastImage);
 try{
  if(!window.Tesseract)await loadOCR();
  const result=await Tesseract.recognize(lastImage,"eng",{logger:m=>{if(m.status==="recognizing text"){const n=p.querySelector(".notice");if(n)n.textContent="Processing image… "+Math.round((m.progress||0)*100)+"%"}}});
  showOCR(result.data?.text||"");
 }catch(e){showOCR("");alert("Image is ready. Automatic OCR needs internet access. You can edit the data and save it.");}
}
function loadOCR(){return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function showOCR(text){
 const p=document.getElementById("importPreview"),target=document.getElementById("importSection").value;
 const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const find=r=>{const x=lines.find(l=>r.test(l));return x?x.replace(r,"").replace(/^[:\- ]+/,"").trim():""};
 const name=find(/(?:name|holder|customer)\s*[:\-]/i),acc=find(/(?:account\s*(?:no|number)|a\/c)\s*[:\-]/i).replace(/\s/g,""),ifsc=find(/ifsc\s*(?:code)?\s*[:\-]/i).replace(/\s/g,"").toUpperCase(),mobile=find(/(?:mobile|phone|contact)\s*(?:no|number)?\s*[:\-]/i).replace(/\D/g,""),amount=find(/(?:amount|total|balance)\s*[:\-]/i).replace(/[^\d.]/g,"");
 p.innerHTML=`<div style="font-weight:700;margin-bottom:10px">Detected Data — Edit</div><div class="formgrid">
 <div class="field"><label>Name</label><input id="ocrName" value="${esc(name)}"></div><div class="field"><label>Account Number</label><input id="ocrAcc" value="${esc(acc)}"></div>
 <div class="field"><label>IFSC</label><input id="ocrIfsc" value="${esc(ifsc)}"></div><div class="field"><label>Mobile</label><input id="ocrMobile" value="${esc(mobile)}"></div>
 <div class="field"><label>Amount</label><input id="ocrAmount" type="number" value="${esc(amount)}"></div></div>
 <div class="field" style="margin-top:12px"><label>Extracted Text</label><textarea id="ocrText">${esc(text)}</textarea></div>
 <div class="actions"><button class="primary" data-save-ocr data-target="${esc(target)}">OK & Save</button><button class="secondary" data-edit-ocr>Edit</button><button class="secondary" data-cancel-import>Delete</button></div>`;
}
function saveOCR(target){
 const d={name:document.getElementById("ocrName")?.value||"",accountNumber:document.getElementById("ocrAcc")?.value||"",ifsc:document.getElementById("ocrIfsc")?.value||"",mobile:document.getElementById("ocrMobile")?.value||"",amount:document.getElementById("ocrAmount")?.value||"",extractedText:document.getElementById("ocrText")?.value||"",source:"Image Import"};
 records.push({id:"rec-"+Date.now(),section:target,data:d,updatedAt:new Date().toISOString()});save(STORE,records);
 alert("Image data saved successfully.");document.getElementById("importPreview").innerHTML=`<div class="notice">Data saved successfully.</div>`;updateHome();
}
function bindDocs(){const b=document.querySelector("[data-pick-doc]"),i=document.getElementById("documentFile"),p=document.getElementById("documentPreview");if(!b||!i)return;b.onclick=()=>i.click();i.onchange=()=>{const f=i.files?.[0];if(f)p.innerHTML=`<div class="notice">${esc(f.name)} selected.</div>`}}
function report(){
 const m=document.querySelector('[data-f="month"]')?.value;if(!m){alert("Select a month.");return}
 const rs=records.filter(r=>String(r.data.date||"").startsWith(m)),inc=rs.filter(r=>r.section==="income").reduce((s,r)=>s+(Number(r.data.amount)||0),0),exp=rs.filter(r=>["expenses","medical"].includes(r.section)).reduce((s,r)=>s+(Number(r.data.amount)||0),0);
 document.getElementById("reportOutput").innerHTML=`<div class="content"><div class="grid"><div class="tile"><span>Income</span><b>${money(inc)}</b></div><div class="tile"><span>Expenses</span><b>${money(exp)}</b></div><div class="tile"><span>Balance</span><b>${money(inc-exp)}</b></div></div></div>`;
}
function backup(){
 const blob=new Blob([JSON.stringify({version:3,records,sections,subitems:load(SUB_STORE,{})},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="homeflow-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function restore(){document.getElementById("restoreFile")?.click()}
document.addEventListener("change",e=>{
 if(e.target.id==="gcat")renderGrocery();
 if(e.target.id==="restoreFile"){const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!Array.isArray(x.records))throw 0;records=x.records;sections=x.sections||defaultSections;save(STORE,records);save(MENU_STORE,sections);save(SUB_STORE,x.subitems||{});buildMenu();alert("Backup restored successfully.");goHome()}catch(_){alert("Invalid backup file.")}};rd.readAsText(f)}
});
document.addEventListener("click",e=>{
 const t=e.target;
 if(t.closest("#menuList")&&t.closest("button"))return;
 if(t.closest("[data-save]")){saveCurrent();return}
 if(t.closest("[data-clear]")){clearForm();return}
 if(t.closest("[data-edit]")){editRecord(t.closest("[data-edit]").dataset.edit);return}
 if(t.closest("[data-delete]")){deleteRecord(t.closest("[data-delete]").dataset.delete);return}
 if(t.closest("[data-process]")){processImage();return}
 if(t.closest("[data-extract]")){extractImage();return}
 if(t.closest("[data-save-ocr]")){saveOCR(t.closest("[data-save-ocr]").dataset.target);return}
 if(t.closest("[data-cancel-import]")){const p=document.getElementById("importPreview");if(p){p.innerHTML="";p.style.display="none"}lastImage=null;return}
 if(t.closest("[data-report]")){report();return}
 if(t.closest("[data-backup]")){backup();return}
 if(t.closest("[data-restore]")){restore();return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("drawer").classList.remove("open");document.getElementById("reminder").classList.remove("show")}});
updateHome();buildMenu();setInterval(updateHome,60000);
</script>
</body>
</html>
