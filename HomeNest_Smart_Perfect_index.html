<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15182e">
<title>HomeNest Smart</title>
<style>
:root{
 --navy:#15182e;--navy2:#222544;--purple:#6655e8;--purple2:#8978f2;
 --bg:#f4f5fa;--card:#fff;--text:#172033;--muted:#697287;--line:#e2e5ee;
 --good:#1c9b72;--danger:#d95362;--warn:#d58a20;--shadow:0 8px 24px rgba(21,24,46,.08)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#eef0f8,#fafaff 48%,#f2f4f8);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:1100px;margin:auto;min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--navy),#1a1d39 60%,#2b2857);color:#fff;padding:12px 14px;box-shadow:0 6px 22px #11152f35}
.brand{display:flex;align-items:center;gap:10px}.logo{width:45px;height:45px;border-radius:14px;background:#ffffff16;border:1px solid #ffffff28;display:grid;place-items:center;font-size:24px}
.brandTitle{font-weight:900;font-size:24px;letter-spacing:-.5px}.brandAccent{color:#9d8fff}.brandSub{display:block;font-size:10px;color:#cbd0e0;margin-top:1px}
.more{margin-left:auto;width:43px;height:43px;border:1px solid #ffffff2a;background:#ffffff12;color:#fff;border-radius:13px;font-size:27px}
.menuStrip{background:linear-gradient(135deg,var(--navy),#171a31);padding:9px 9px 11px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:relative}
.menuStrip button{min-height:47px;border:1px solid transparent;background:transparent;color:#d9dbe5;border-radius:12px;padding:7px 5px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;text-align:left}
.menuStrip button.active,.menuStrip button:hover{background:#383454;border-color:#59547e;color:#fff}
.menuIcon{font-size:17px;min-width:20px;text-align:center}.menuLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{padding:0 13px 40px}
.hero{background:linear-gradient(180deg,#fbfbfe,#f0f1f8);padding:19px 14px 15px;border-bottom:1px solid var(--line)}
.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.greeting{font-size:30px;font-weight:900;letter-spacing:-1px;margin:0 0 5px}.welcome{margin:0;color:#596176;line-height:1.4;font-size:15px}
.dateTime{background:#fff;border:1px solid var(--line);border-radius:15px;padding:8px 10px;min-width:180px}
.date{font-size:12px;color:#4d566d;font-weight:800}.time{font-size:20px;color:var(--purple);font-weight:900;margin-top:2px}
.quick{display:flex;gap:8px;margin-top:14px}.quick button{flex:1;min-height:59px;border-radius:16px;border:1px solid var(--line);background:#fff;font-weight:850;box-shadow:0 4px 13px #11152f0b}
.quick .rem{background:linear-gradient(135deg,#6655e8,#7664ea);border-color:#6655e8;color:#fff}.quick .dot{flex:0 0 55px;font-size:26px}
.homeArea{padding-top:15px}.homeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.homeCard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow);min-height:92px}
.homeCard b{display:block;font-size:13px;margin-top:6px}.homeCard span{font-size:11px;color:var(--muted)}
.section{display:none}.section.show{display:block}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:17px 1px 12px}.sectionHead h2{margin:0;font-size:23px}.back{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-weight:800}
.dashboardGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;box-shadow:var(--shadow);min-height:91px}.stat .ico{font-size:20px}.stat b{display:block;font-size:20px;margin-top:5px}.stat small{color:var(--muted);font-size:11px}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;margin-top:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 11px;font-size:17px}.formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:850;color:#5e677c;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fbfcfe;border-radius:11px;padding:11px 12px;color:var(--text);outline:none}.field textarea{min-height:78px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:850}.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:#4f5870}.danger{background:#fff0f2;border:1px solid #ffd1d7;color:var(--danger)}
.savedToggle{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;font-weight:900}.savedToggle .chev{font-size:18px}.savedBody{display:none;margin-top:10px}.savedBody.open{display:block}.item{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;background:#fcfdff}.itemTop{display:flex;justify-content:space-between;gap:8px}.itemTitle{font-weight:900}.muted{color:var(--muted);font-size:12px;line-height:1.5}.tag{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;background:#eef0ff;color:#5c50c8}.money{font-weight:900}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.miniBtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:850}.miniBtn.danger{color:var(--danger);background:#fff7f8}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed #d7dbe7;border-radius:13px}
.notice{background:#f1f0ff;border:1px solid #dedaff;border-radius:13px;padding:11px;color:#545c76;font-size:12px;line-height:1.5}
.monthBar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.monthBar select,.monthBar input{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.planBox{background:linear-gradient(135deg,#f0efff,#fff);border:1px solid #dedaff;border-radius:16px;padding:13px;margin-top:10px}.progress{height:9px;border-radius:99px;background:#e9eaf2;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#6655e8,#9a8cf5)}
.modal{position:fixed;inset:0;background:#10142699;z-index:100;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalBox{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:17px;box-shadow:0 25px 70px #10142655}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalHead h3{margin:0}.x{width:36px;height:36px;border:0;border-radius:10px;background:#eef0f6;font-size:21px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#15182e;color:#fff;padding:11px 15px;border-radius:12px;z-index:200;font-weight:800;font-size:13px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.dotNav{display:flex;justify-content:center;gap:5px;margin:7px 0}.dotNav button{width:7px;height:7px;border:0;border-radius:50%;background:#cfd2df;padding:0}.dotNav button.active{width:20px;border-radius:10px;background:#6655e8}
#ocrStatus{margin-top:8px;font-size:12px;font-weight:800;color:#5c50c8}.previewImg{max-width:100%;max-height:230px;display:block;margin:10px auto;border-radius:12px;border:1px solid var(--line)}
@media(max-width:760px){.homeGrid,.dashboardGrid{grid-template-columns:repeat(2,1fr)}.formGrid{grid-template-columns:1fr}}
@media(max-width:520px){.heroTop{display:block}.dateTime{margin-top:11px;min-width:0;display:flex;justify-content:space-between;align-items:center}.time{margin:0}.main{padding:0 9px 30px}.greeting{font-size:28px}.homeCard{padding:12px}.menuStrip{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">🏠</div><div><div class="brandTitle">HomeNest <span class="brandAccent">Smart</span></div><span class="brandSub">Home • Money • Family • Plans</span></div></div>
  <button class="more" onclick="openMore()">⋮</button>
</header>
<nav id="menuStrip" class="menuStrip"></nav>

<main class="main">
<section id="home" class="hero">
  <div class="heroTop">
    <div><h1 id="greeting" class="greeting">Good Evening 👋</h1><p class="welcome">Welcome to your smart home command center.</p></div>
    <div class="dateTime"><div id="date" class="date"></div><div id="time" class="time"></div></div>
  </div>
  <div class="quick">
    <button onclick="openSection('image')">🖼️ Import Image</button>
    <button class="rem" onclick="openSection('reminders')">⏰ Reminder</button>
    <button class="dot" onclick="toggleQuick()">•</button>
  </div>
  <div id="homeQuick" class="homeArea">
    <div class="homeGrid" id="homeCards"></div>
  </div>
  <div class="dotNav" id="homeDots"></div>
</section>

<div id="sections"></div>
</main>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalBox">
  <div class="modalHead"><h3 id="modalTitle">Details</h3><button class="x" onclick="closeModal()">×</button></div>
  <div id="modalBody"></div>
</div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const KEY='homenest_smart_v2';
const old=JSON.parse(localStorage.getItem(KEY)||'null');
let db=old||{
 income:[],expenses:[],groceries:[],savings:[],savingPlans:[],loans:[],loanPayments:[],accounts:[],reminders:[],tripPlans:[],needs:[],notes:[],imageImports:[]
};
db.income=db.income||[];db.expenses=db.expenses||[];db.groceries=db.groceries||[];db.savings=db.savings||[];
db.savingPlans=db.savingPlans||[];db.loans=db.loans||[];db.loanPayments=db.loanPayments||[];db.accounts=db.accounts||[];
db.reminders=db.reminders||[];db.tripPlans=db.tripPlans||[];db.needs=db.needs||[];db.notes=db.notes||[];db.imageImports=db.imageImports||[];
let current='home',quickOpen=true,editing={type:null,id:null};

function saveDB(){localStorage.setItem(KEY,JSON.stringify(db));renderHome();if(current!=='home')renderSection(current)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function today(){return new Date().toISOString().slice(0,10)}
function monthNow(){return today().slice(0,7)}
function uid(){return Date.now()+Math.floor(Math.random()*999)}
function fmtDate(d){if(!d)return '-';return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function monthName(m){if(!m)return '';let [y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')}
function openMore(){modal('More Options',`<div class="actions">
<button class="btn secondary" onclick="closeModal();openSection('reports')">📊 Reports</button>
<button class="btn secondary" onclick="closeModal();openSection('savings')">🎯 Savings Plans</button>
<button class="btn secondary" onclick="closeModal();openSection('loans')">📑 Bills & EMI</button>
<button class="btn secondary" onclick="closeModal();openSection('accounts')">🏦 Accounts</button>
<button class="btn secondary" onclick="closeModal();openSection('backup')">💾 Backup</button></div>`)}

const menus=[
 ['income','💰','Income'],['expenses','🧾','Expenses'],['groceries','🛒','Groceries'],
 ['savings','🎯','Savings'],['loans','📑','Bills & EMI'],['trip','✈️','Trip Plan'],
 ['needs','🛍️','My Needs'],['reminders','⏰','Reminders'],['reports','📊','Reports'],
 ['accounts','🏦','Accounts'],['image','🖼️','Image Import'],['backup','💾','Backup']
];
function renderMenu(){
 document.getElementById('menuStrip').innerHTML=menus.map(x=>`<button class="${current===x[0]?'active':''}" onclick="openSection('${x[0]}')"><span class="menuIcon">${x[1]}</span><span class="menuLabel">${x[2]}</span></button>`).join('');
}
function updateClock(){
 let n=new Date(),h=n.getHours(),g=h<5?'Good Night':h<12?'Good Morning':h<17?'Good Afternoon':h<21?'Good Evening':'Good Night';
 document.getElementById('greeting').textContent=g+' 👋';
 document.getElementById('date').textContent=n.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 document.getElementById('time').textContent=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function toggleQuick(){quickOpen=!quickOpen;document.getElementById('homeQuick').style.display=quickOpen?'block':'none';document.querySelector('.dot').textContent=quickOpen?'•':'••'}
function openSection(id){current=id;renderMenu();document.getElementById('home').style.display='none';renderSection(id);window.scrollTo({top:0,behavior:'smooth'})}
function goHome(){current='home';renderMenu();document.getElementById('home').style.display='block';document.getElementById('sections').innerHTML='';window.scrollTo({top:0,behavior:'smooth'});renderHome()}

function renderHome(){
 let mi=db.income.filter(x=>x.date&&x.date.slice(0,7)===monthNow()).reduce((a,x)=>a+Number(x.amount),0);
 let me=db.expenses.filter(x=>x.date&&x.date.slice(0,7)===monthNow()).reduce((a,x)=>a+Number(x.amount),0);
 let due=db.loans.reduce((a,l)=>a+loanBalance(l),0);
 let cards=[
  ['💰','Income',money(mi),'This month','income'],['🧾','Expenses',money(me),'This month','expenses'],
  ['🎯','Savings',money(db.savings.reduce((a,x)=>a+Number(x.amount),0)),'Saved so far','savings'],['📑','Loan Balance',money(due),'Current balance','loans'],
  ['🛒','Groceries',db.groceries.length+' records','Saved data','groceries'],['✈️','Trip Plans',db.tripPlans.length+' plans','Saved plans','trip'],
  ['🛍️','My Needs',db.needs.length+' items','Saved needs','needs'],['⏰','Reminders',db.reminders.filter(x=>x.date>=today()).length+' upcoming','Open reminders','reminders']
 ];
 document.getElementById('homeCards').innerHTML=cards.map(c=>`<button class="homeCard" onclick="openSection('${c[4]}')" style="text-align:left"><div>${c[0]}</div><b>${c[1]}</b><strong>${c[2]}</strong><span>${c[3]}</span></button>`).join('');
}
function sectionShell(id,title,icon,body){
 document.getElementById('sections').innerHTML=`<section class="section show"><div class="sectionHead"><h2>${icon} ${title} Dashboard</h2><button class="back" onclick="goHome()">⌂ Home</button></div>${body}</section>`;
}

function savedBox(id,title,content,count){
 return `<div class="card"><button class="savedToggle" onclick="toggleSaved('${id}')"><span>☑️ ${title} ${count!==undefined?'('+count+')':''}</span><span class="chev" id="chev-${id}">＋</span></button><div id="${id}" class="savedBody">${content}</div></div>`;
}
function toggleSaved(id){let e=document.getElementById(id);if(!e)return;e.classList.toggle('open');let c=document.getElementById('chev-'+id);if(c)c.textContent=e.classList.contains('open')?'−':'＋'}

function incomePage(){
 let m=monthNow(),daily=db.income.filter(x=>x.type==='Daily').reduce((a,x)=>a+Number(x.amount),0),monthly=db.income.filter(x=>x.type==='Monthly').reduce((a,x)=>a+Number(x.amount),0),overall=db.income.reduce((a,x)=>a+Number(x.amount),0);
 let dayExp=db.expenses.filter(x=>x.source==='Daily Income').reduce((a,x)=>a+Number(x.amount),0),monExp=db.expenses.filter(x=>x.source==='Monthly Income').reduce((a,x)=>a+Number(x.amount),0),allExp=db.expenses.reduce((a,x)=>a+Number(x.amount),0);
 let list=db.income.slice().sort((a,b)=>b.date.localeCompare(a.date)).map((x,i)=>`<div class="item"><div class="itemTop"><div><div class="itemTitle">${esc(x.name||'Income')}</div><div class="muted">${fmtDate(x.date)} • ${esc(x.type)}</div></div><b class="money">${money(x.amount)}</b></div><div class="muted">${esc(x.note||'')}</div><div class="row" style="margin-top:7px"><button class="miniBtn" onclick="editIncome('${x.id}')">Edit</button><button class="miniBtn danger" onclick="del('income','${x.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No saved income data yet.</div>';
 return `<div class="dashboardGrid">
 <div class="stat">☀️<b>${money(daily)}</b><small>Daily Income</small></div><div class="stat">📅<b>${money(monthly)}</b><small>Monthly Income</small></div><div class="stat">📊<b>${money(overall)}</b><small>Overall Income</small></div><div class="stat">💸<b>${money(dayExp+monExp)}</b><small>Income Used</small></div></div>
 <div class="card"><h3>Add Income</h3><div class="formGrid">
 <div class="field"><label>Name / Source</label><input id="inName" placeholder="Salary / Business"></div>
 <div class="field"><label>Amount *</label><input id="inAmt" type="number" min="0"></div>
 <div class="field"><label>Income Type *</label><select id="inType"><option>Daily</option><option>Monthly</option></select></div>
 <div class="field"><label>Date *</label><input id="inDate" type="date" value="${today()}"></div>
 <div class="field"><label>Note</label><input id="inNote"></div></div>
 <div class="actions"><button class="btn primary" onclick="addIncome()">Save Income</button></div></div>
 <div class="card"><h3>Expense Split Against Income</h3><div class="dashboardGrid"><div class="stat">☀️<b>${money(dayExp)}</b><small>Daily Income Expenses</small></div><div class="stat">📅<b>${money(monExp)}</b><small>Monthly Income Expenses</small></div><div class="stat">📊<b>${money(allExp)}</b><small>Overall Expenses</small></div><div class="stat">💰<b>${money(overall-allExp)}</b><small>Income Balance</small></div></div></div>
 ${savedBox('saved-income','Saved Income',list,db.income.length)}`;
}
function addIncome(){let name=inName.value.trim(),amt=Number(inAmt.value),type=inType.value,date=inDate.value;if(!amt||!date){toast('Enter amount and date');return}db.income.push({id:uid(),name,amount:amt,type,date,note:inNote.value.trim()});saveDB();toast('Income saved');}
function editIncome(id){let x=db.income.find(a=>String(a.id)===String(id));if(!x)return;modal('Edit Income',`<div class="formGrid"><div class="field"><label>Name</label><input id="eName" value="${esc(x.name)}"></div><div class="field"><label>Amount</label><input id="eAmt" type="number" value="${x.amount}"></div><div class="field"><label>Type</label><select id="eType"><option ${x.type==='Daily'?'selected':''}>Daily</option><option ${x.type==='Monthly'?'selected':''}>Monthly</option></select></div><div class="field"><label>Date</label><input id="eDate" type="date" value="${x.date}"></div></div><div class="actions"><button class="btn primary" onclick="x.name=eName.value;x.amount=Number(eAmt.value);x.type=eType.value;x.date=eDate.value;saveDB();closeModal()">Save Changes</button></div>`)}
function expensesPage(){
 let d=db.expenses.filter(x=>x.source==='Daily Income').reduce((a,x)=>a+Number(x.amount),0),m=db.expenses.filter(x=>x.source==='Monthly Income').reduce((a,x)=>a+Number(x.amount),0),o=db.expenses.reduce((a,x)=>a+Number(x.amount),0);
 let list=db.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="item"><div class="itemTop"><div><div class="itemTitle">${esc(x.category||'Expense')}</div><div class="muted">${fmtDate(x.date)} • ${esc(x.source)}</div></div><b class="money">${money(x.amount)}</b></div><div class="muted">${esc(x.note||'')}</div><div class="row" style="margin-top:7px"><button class="miniBtn" onclick="editExpense('${x.id}')">Edit</button><button class="miniBtn danger" onclick="del('expenses','${x.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No saved expense data yet.</div>';
 return `<div class="dashboardGrid"><div class="stat">☀️<b>${money(d)}</b><small>Daily Income Expenses</small></div><div class="stat">📅<b>${money(m)}</b><small>Monthly Income Expenses</small></div><div class="stat">📊<b>${money(o)}</b><small>Overall Expenses</small></div><div class="stat">💰<b>${money(d+m)}</b><small>Current Split</small></div></div>
 <div class="card"><h3>Add Expense</h3><div class="formGrid"><div class="field"><label>Category *</label><input id="exCat" placeholder="Food / Travel / Bill"></div><div class="field"><label>Amount *</label><input id="exAmt" type="number" min="0"></div><div class="field"><label>Expense Source *</label><select id="exSource"><option>Daily Income</option><option>Monthly Income</option><option>Other</option></select></div><div class="field"><label>Date *</label><input id="exDate" type="date" value="${today()}"></div><div class="field"><label>Payment</label><select id="exPay"><option>Cash</option><option>GPay</option><option>Bank</option></select></div><div class="field"><label>Note</label><input id="exNote"></div></div><div class="actions"><button class="btn primary" onclick="addExpense()">Save Expense</button></div></div>
 ${savedBox('saved-expenses','Saved Expenses',list,db.expenses.length)}`;
}
function addExpense(){let c=exCat.value.trim(),a=Number(exAmt.value),s=exSource.value,d=exDate.value;if(!c||!a||!d){toast('Enter category, amount and date');return}db.expenses.push({id:uid(),category:c,amount:a,source:s,date:d,payment:exPay.value,note:exNote.value.trim()});saveDB();toast('Expense saved')}

 let list=db.accounts.map(x=>`<div class="item"><div class="itemTop"><div><div class="itemTitle">🏦 ${esc(x.name)}</div><div class="muted">${esc(x.type||'Account')}</div></div><b class="money">${money(x.balance)}</b></div><div class="row" style="margin-top:7px"><button class="miniBtn" onclick="editAccount('${x.id}')">Edit</button><button class="miniBtn danger" onclick="del('accounts','${x.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No accounts. Enter any names you want — no fixed Husband/Father/Mother/My Account names are forced.</div>';
 return `<div class="dashboardGrid"><div class="stat">🏦<b>${db.accounts.length}</b><small>Saved Names</small></div><div class="stat">💰<b>${money(db.accounts.reduce((a,x)=>a+Number(x.balance),0))}</b><small>Total Balance</small></div><div class="stat">✏️<b>Custom</b><small>You choose names</small></div><div class="stat">🔽<b>Ready</b><small>Select from saved names</small></div></div>
 <div class="card"><h3>Add Account Name</h3><div class="formGrid"><div class="field"><label>Account / Person Name *</label><input id="acName" placeholder="Enter your own name"></div><div class="field"><label>Type</label><input id="acType" placeholder="Bank / Cash / GPay"></div><div class="field"><label>Opening Balance</label><input id="acBal" type="number"></div></div><div class="actions"><button class="btn primary" onclick="addAccount()">Save Account</button></div></div>
 ${savedBox('saved-accounts','Saved Account Names',list,db.accounts.length)}`;
}
function addAccount(){if(!acName.value.trim()){toast('Enter account name');return}db.accounts.push({id:uid(),name:acName.value.trim(),type:acType.value.trim(),balance:Number(acBal.value||0)});saveDB();toast('Account saved')}
function editAccount(id){let x=db.accounts.find(a=>String(a.id)===String(id));modal('Edit Account',`<div class="formGrid"><div class="field"><label>Name</label><input id="eaN" value="${esc(x.name)}"></div><div class="field"><label>Balance</label><input id="eaB" type="number" value="${x.balance}"></div></div><div class="actions"><button class="btn primary" onclick="x.name=eaN.value;x.balance=Number(eaB.value);saveDB();closeModal()">Save Changes</button></div>`)}
function reportsPage(){
 let m=monthNow(),months=[...new Set([...db.income,...db.expenses,...db.groceries,...db.savings,...db.loanPayments].map(x=>(x.date||'').slice(0,7)).filter(Boolean))].sort().reverse();if(!months.includes(m))months.unshift(m);
 return `<div class="card"><h3>Monthly Report</h3><div class="monthBar"><label>Choose Month</label><select id="reportMonth" onchange="showReport(this.value)">${months.map(x=>`<option ${x===m?'selected':''} value="${x}">${monthName(x)}</option>`).join('')}</select></div><div id="reportResult"></div></div><div class="card"><h3>Yearly Report</h3><div class="monthBar"><select id="reportYear" onchange="showYear(this.value)">${[...new Set(months.map(x=>x.slice(0,4)))].map(y=>`<option>${y}</option>`).join('')}</select></div><div id="yearResult"></div></div>`;
}
function showReport(m){let inc=db.income.filter(x=>x.date.slice(0,7)===m).reduce((a,x)=>a+Number(x.amount),0),ex=db.expenses.filter(x=>x.date.slice(0,7)===m).reduce((a,x)=>a+Number(x.amount),0),sv=db.savings.filter(x=>x.date.slice(0,7)===m).reduce((a,x)=>a+Number(x.amount),0),lp=db.loanPayments.filter(x=>x.date.slice(0,7)===m).reduce((a,x)=>a+Number(x.amount),0);document.getElementById('reportResult').innerHTML=`<div class="dashboardGrid" style="margin-top:12px"><div class="stat">💰<b>${money(inc)}</b><small>Income</small></div><div class="stat">🧾<b>${money(ex)}</b><small>Expenses</small></div><div class="stat">🎯<b>${money(sv)}</b><small>Savings</small></div><div class="stat">📑<b>${money(lp)}</b><small>EMI Paid</small></div></div>`}
function showYear(y){let inc=db.income.filter(x=>x.date.startsWith(y)).reduce((a,x)=>a+Number(x.amount),0),ex=db.expenses.filter(x=>x.date.startsWith(y)).reduce((a,x)=>a+Number(x.amount),0),sv=db.savings.filter(x=>x.date.startsWith(y)).reduce((a,x)=>a+Number(x.amount),0);document.getElementById('yearResult').innerHTML=`<div class="dashboardGrid" style="margin-top:12px"><div class="stat">💰<b>${money(inc)}</b><small>Income</small></div><div class="stat">🧾<b>${money(ex)}</b><small>Expenses</small></div><div class="stat">🎯<b>${money(sv)}</b><small>Savings</small></div><div class="stat">📊<b>${money(inc-ex)}</b><small>Net</small></div></div>`}
function backupPage(){
 return `<div class="card"><h3>Backup / Restore</h3><div class="notice">All saved data is stored in this browser's local storage. Backup creates a JSON file. Restore reads that file back into this app.</div><div class="actions"><button class="btn primary" onclick="downloadBackup()">⬇️ Download Backup</button><button class="btn secondary" onclick="document.getElementById('restoreFile').click()">⬆️ Restore Backup</button><input id="restoreFile" type="file" accept=".json" hidden onchange="restoreBackup(event)"></div></div>`;
}
function imagePage(){
 return `<div class="card"><h3>Image Import → Process → Check → Save</h3><div class="notice">Choose an image. OCR will try to read the text. You can edit the detected values before saving. Nothing is saved until you press Save Detected Data.</div><div class="formGrid"><div class="field"><label>Send Data To *</label><select id="ocrTarget"><option value="income">Income</option><option value="expenses">Expenses</option><option value="groceries">Groceries</option><option value="savings">Savings</option><option value="loans">Loan Details</option><option value="accounts">Accounts</option></select></div><div class="field"><label>Choose Image</label><input id="ocrFile" type="file" accept="image/*" onchange="processImage(this.files[0])"></div></div><div id="ocrStatus"></div><img id="ocrPreview" class="previewImg" style="display:none"><div class="card" id="ocrEdit" style="display:none"><h3>Detected Data — Check / Edit</h3><div class="formGrid"><div class="field"><label>Name / Title</label><input id="ocrName"></div><div class="field"><label>Amount</label><input id="ocrAmount" type="number"></div><div class="field"><label>Date</label><input id="ocrDate" type="date" value="${today()}"></div><div class="field"><label>Notes / OCR Text</label><textarea id="ocrText"></textarea></div></div><div class="actions"><button class="btn primary" onclick="saveOCR()">☑️ Save Detected Data</button><button class="btn secondary" onclick="clearOCR()">Clear</button></div></div>
 ${savedBox('saved-images','Saved Image Imports',db.imageImports.map(x=>`<div class="item"><div class="itemTitle">${esc(x.name)}</div><div class="muted">${fmtDate(x.date)} • ${esc(x.target)} • ${money(x.amount)}</div><div class="muted">${esc(x.text).slice(0,300)}</div><div class="row" style="margin-top:7px"><button class="miniBtn danger" onclick="del('imageImports','${x.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No processed image data saved.</div>',db.imageImports.length)}`;
}
async function processImage(file){
 if(!file){return}
 let img=document.getElementById('ocrPreview'),status=document.getElementById('ocrStatus');img.src=URL.createObjectURL(file);img.style.display='block';status.textContent='Processing image… Please wait.';
 try{
  if(!window.Tesseract)throw new Error('OCR library not loaded');
  let result=await Tesseract.recognize(file,'eng',{logger:m=>{if(m.status)status.textContent=m.status+' '+Math.round((m.progress||0)*100)+'%'}});
  let text=result.data.text||'',amounts=text.match(/(?:₹|rs\.?|inr)?\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)/ig)||[];
  let first=amounts.length?amounts[amounts.length-1].replace(/[^\d.]/g,''):'';let lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  document.getElementById('ocrName').value=lines[0]||'Imported Image';
  document.getElementById('ocrAmount').value=first.replace(/,/g,'')||'';
  document.getElementById('ocrText').value=text;
  document.getElementById('ocrEdit').style.display='block';status.textContent='Processing complete. Check the data before saving.';
 }catch(e){status.textContent='OCR could not complete. You can still enter the data manually below.';document.getElementById('ocrName').value='Imported Image';document.getElementById('ocrEdit').style.display='block'}
}
function saveOCR(){let target=ocrTarget.value,name=ocrName.value.trim()||'Imported Image',amount=Number(ocrAmount.value||0),date=ocrDate.value,text=ocrText.value;if(target==='income')db.income.push({id:uid(),name,amount,type:'Daily',date,note:'Image import'});else if(target==='expenses')db.expenses.push({id:uid(),category:name,amount,source:'Other',date,payment:'Other',note:'Image import'});else if(target==='groceries')db.groceries.push({id:uid(),category:'Imported',item:name,amount,date,checked:false});else if(target==='savings')db.savings.push({id:uid(),planId:'',amount,date,kind:name});else if(target==='accounts')db.accounts.push({id:uid(),name,balance:amount,type:'Imported'});else if(target==='loans')db.loans.push({id:uid(),person:name,name:'Imported Loan',originalAmount:amount,rate:0,emi:0,start:date});db.imageImports.push({id:uid(),name,amount,date,target,text});saveDB();toast('Image data saved');clearOCR()}
function clearOCR(){document.getElementById('ocrEdit').style.display='none';document.getElementById('ocrPreview').style.display='none';document.getElementById('ocrFile').value='';document.getElementById('ocrStatus').textContent=''}
function renderSection(id){
 let body='';
 if(id==='income')body=incomePage(),sectionShell(id,'Income','💰',body);
 else if(id==='expenses')body=expensesPage(),sectionShell(id,'Expenses','🧾',body);
 else if(id==='groceries')body=groceriesPage(),sectionShell(id,'Groceries','🛒',body);
 else if(id==='savings')body=savingsPage(),sectionShell(id,'Savings','🎯',body);
 else if(id==='loans')body=loansPage(),sectionShell(id,'Bills & EMI','📑',body);
 else if(id==='trip')body=tripPage(),sectionShell(id,'Trip Plan','✈️',body);
 else if(id==='needs')body=needsPage(),sectionShell(id,'My Needs','🛍️',body);
 else if(id==='reminders')body=remindersPage(),sectionShell(id,'Reminders','⏰',body);
 else if(id==='accounts')body=accountsPage(),sectionShell(id,'Accounts','🏦',body);
 else if(id==='reports')body=reportsPage(),sectionShell(id,'Reports','📊',body);
 else if(id==='backup')body=backupPage(),sectionShell(id,'Backup / Restore','💾',body);
 else if(id==='image')body=imagePage(),sectionShell(id,'Image Import','🖼️',body);
 if(id==='reports'){showReport(monthNow());let y=document.getElementById('reportYear');if(y)showYear(y.value)}
}
function del(type,id){if(!confirm('Delete this saved data?'))return;db[type]=db[type].filter(x=>String(x.id)!==String(id));saveDB();toast('Deleted')}
function downloadBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='HomeNest_Smart_Backup_'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||typeof x!=='object')throw 0;db=x;saveDB();toast('Backup restored')}catch{toast('Invalid backup file')}};r.readAsText(f)}
function autoPlanPopup(){
 let now=Date.now(),last=Number(localStorage.getItem('hn_last_plan_popup')||0),week=7*864e5;
 if(db.savingPlans.length&&now-last>week){let p=db.savingPlans[0],suggest=Number(p.suggested||0);setTimeout(()=>modal('🎯 Saving Plan Reminder',`<p>Your plan <b>${esc(p.name)}</b> is active.</p><div class="planBox"><b>Suggested saving now: ${money(suggest)}</b><div class="muted">You can change the amount and record what you actually saved.</div></div><div class="actions"><button class="btn primary" onclick="closeModal();openSection('savings')">Open Savings</button><button class="btn secondary" onclick="closeModal()">Later</button></div>`),900);localStorage.setItem('hn_last_plan_popup',String(now))}
}
updateClock();renderMenu();renderHome();setInterval(updateClock,1000);setTimeout(autoPlanPopup,1200);
</script>
</body>
</html>
